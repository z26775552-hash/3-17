    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #08090c;
            color: #e9e9ed;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(67, 76, 110, 0.10), transparent 30%),
                radial-gradient(circle at 85% 70%, rgba(31, 41, 66, 0.12), transparent 30%);
            z-index: -1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: rgba(8, 9, 12, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #f2f2f4;
        }

        .logo span {
            color: #777d91;
        }

        nav {
            display: flex;
            gap: 34px;
            align-items: center;
        }

        nav a {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #9295a0;
            transition: 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .nav-read {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 17px;
            border-radius: 2px;
        }

        .nav-read:hover {
            background: #f0f0f0;
            color: #08090c;
        }

        .hero {
            min-height: calc(100vh - 76px);
            padding: 90px 7% 100px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 70px;
            position: relative;
        }

        .hero-content {
            max-width: 720px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #777d91;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .eyebrow::before {
            content: "";
            width: 30px;
            height: 1px;
            background: #777d91;
        }

        .hero-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(100px, 15vw, 210px);
            line-height: 0.72;
            font-weight: 500;
            letter-spacing: -7px;
            color: #f0f0f2;
        }

        .hero-am {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(40px, 5vw, 70px);
            letter-spacing: 12px;
            margin-top: 22px;
            color: #74798a;
        }

        .hero-text {
            max-width: 550px;
            margin-top: 38px;
            color: #a6a8b0;
            font-size: 15px;
            line-height: 1.9;
            font-weight: 300;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 27px;
        }

        .tag {
            border: 1px solid rgba(255,255,255,0.11);
            padding: 8px 11px;
            color: #858996;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        .hero-buttons {
            display: flex;
            gap: 13px;
            margin-top: 38px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 145px;
            padding: 14px 21px;
            border: 1px solid rgba(255,255,255,0.17);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.3s ease;
        }

        .btn-primary {
            background: #e9e9eb;
            color: #090a0d;
        }

        .btn-primary:hover {
            background: white;
            transform: translateY(-2px);
        }

        .btn-secondary {
            color: #b7bac4;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone {
            width: 285px;
            height: 570px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 35px;
            padding: 9px;
            background: #111319;
            box-shadow:
                0 35px 100px rgba(0,0,0,0.65),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            transform: rotate(2deg);
        }

        .phone-screen {
            height: 100%;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(145deg, #151923, #08090c 65%);
            display: flex;
            flex-direction: column;
        }

        .phone-notch {
            position: absolute;
            width: 92px;
            height: 23px;
            background: #050507;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 17px 17px;
            z-index: 3;
        }

        .phone-time {
            text-align: center;
            font-family: "Cormorant Garamond", serif;
            font-size: 78px;
            margin-top: 105px;
            line-height: 1;
            color: #ececef;
        }

        .phone-small {
            text-align: center;
            margin-top: 10px;
            color: #777d8d;
            font-size: 9px;
            letter-spacing: 2px;
        }

        .phone-message {
            margin: auto 22px 45px;
            border: 1px solid rgba(255,255,255,0.10);
            padding: 18px;
            background: rgba(255,255,255,0.025);
        }

        .phone-message-top {
            color: #74798b;
            font-size: 8px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .phone-message-text {
            font-family: "Cormorant Garamond", serif;
            font-size: 23px;
            line-height: 1.2;
            color: #e3e3e7;
        }

        .section {
            padding: 120px 7%;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .section-label {
            color: #666b7b;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .section-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(45px, 6vw, 82px);
            font-weight: 500;
            line-height: 0.95;
            max-width: 800px;
        }

        .story-grid {
            margin-top: 60px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .story-text {
            color: #a4a6af;
            font-size: 15px;
            line-height: 2;
            font-weight: 300;
        }

        .story-text p + p {
            margin-top: 22px;
        }

        .rule-box {
            border-left: 1px solid #555b6e;
            padding-left: 30px;
        }

        .rule-number {
            color: #666b7b;
            font-size: 10px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .rule-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 38px;
            margin-bottom: 13px;
        }

        .rule-text {
            color: #898c96;
            line-height: 1.8;
            font-size: 14px;
        }

        .progress-box {
            margin-top: 70px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(255,255,255,0.015);
        }

        .progress-info {
            color: #777b88;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 230px;
            height: 2px;
            background: rgba(255,255,255,0.08);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #b7bbc8;
            transition: width 0.4s ease;
        }

        .chapters {
            margin-top: 60px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .chapter {
            min-height: 280px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: 0.3s ease;
            display: block;
        }

        .chapter:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            background: rgba(255,255,255,0.02);
        }

        .chapter-number {
            color: #666b7b;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .chapter-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 38px;
            margin-top: 55px;
        }

        .chapter-description {
            color: #777b86;
            font-size: 12px;
            line-height: 1.7;
            margin-top: 12px;
            max-width: 300px;
        }

        .chapter-arrow {
            position: absolute;
            right: 25px;
            bottom: 22px;
            color: #858998;
            font-size: 20px;
        }

        .notify {
            margin-top: 80px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 55px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(70,77,100,0.09), transparent 65%);
        }

        .notify h3 {
            font-family: "Cormorant Garamond", serif;
            font-size: 43px;
            font-weight: 500;
        }

        .notify p {
            color: #777b87;
            font-size: 13px;
            margin-top: 10px;
        }

        .notify-form {
            margin: 27px auto 0;
            display: flex;
            max-width: 500px;
        }

        .notify-form input {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.13);
            color: white;
            padding: 14px;
            outline: none;
            font-family: inherit;
        }

        .notify-form button {
            background: #e9e9eb;
            color: #08090c;
            border: none;
            padding: 0 22px;
            font-family: inherit;
            cursor: pointer;
        }

        .about-grid {
            margin-top: 60px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .about-text {
            color: #989ba5;
            line-height: 2;
            font-size: 14px;
        }

        .creator {
            border-left: 1px solid rgba(255,255,255,0.13);
            padding-left: 30px;
        }

        .creator-label {
            color: #686d7d;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .creator-name {
            font-family: "Cormorant Garamond", serif;
            font-size: 48px;
            margin-top: 10px;
        }

        .feedback-section {
            margin: 0 7%;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 80px 0;
        }

        .rating-summary {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .rating-big {
            font-family: "Cormorant Garamond", serif;
            font-size: 58px;
            line-height: 1;
        }

        .stars-display {
            color: #d7d9df;
            letter-spacing: 5px;
            font-size: 18px;
        }

        .rating-meta {
            color: #777b87;
            font-size: 12px;
            line-height: 1.7;
        }

        .feedback-grid {
            margin-top: 35px;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 35px;
        }

        .feedback-card {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 28px;
            background: rgba(255,255,255,0.015);
        }

        .feedback-card h3 {
            font-family: "Cormorant Garamond", serif;
            font-size: 31px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .feedback-form {
            display: grid;
            gap: 12px;
        }

        .feedback-form input,
        .feedback-form textarea {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.13);
            color: #fff;
            padding: 13px;
            outline: none;
            font-family: inherit;
        }

        .feedback-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .star-picker {
            display: flex !important;
            gap: 8px !important;
            position: relative !important;
            z-index: 9999 !important;
        }

        .star-picker button {
            appearance: none !important;
            -webkit-appearance: none !important;
            border: none !important;
            background: transparent !important;
            color: #555966 !important;
            font-size: 36px !important;
            line-height: 1 !important;
            cursor: pointer !important;
            padding: 6px !important;
            min-width: 48px !important;
            min-height: 48px !important;
            opacity: 1 !important;
            filter: none !important;
            position: relative !important;
            z-index: 10000 !important;
        }

        .star-picker button.active {
            color: #ffffff !important;
            opacity: 1 !important;
            text-shadow: 0 0 12px #ffffff !important;
        }

        .star-picker button:hover {
            color: #dddddd !important;
        }

        .star-picker button.active:hover {
            color: #ffffff !important;
        }

        .check-row {
            display: flex;
            gap: 9px;
            align-items: center;
            color: #858996;
            font-size: 12px;
            line-height: 1.5;
        }

        .feedback-submit {
            background: #e9e9eb;
            color: #08090c;
            border: 0;
            padding: 14px 18px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-size: 10px;
        }

        .form-status {
            min-height: 18px;
            color: #969aa7;
            font-size: 11px;
            line-height: 1.5;
        }

        .reviews-list {
            display: grid;
            gap: 12px;
            max-height: 500px;
            overflow: auto;
            padding-right: 4px;
        }

        .review-item {
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 0 0 18px;
        }

        .review-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        .review-name {
            color: #d9dbe1;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .review-stars {
            color: #cfd2da;
            letter-spacing: 2px;
            font-size: 12px;
        }

        .review-text {
            color: #858996;
            font-size: 13px;
            line-height: 1.75;
            margin-top: 8px;
        }

        .request-count {
            color: #777b87;
            font-size: 11px;
            margin-top: 16px;
        }

        footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 35px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #555966;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .footer-name {
            color: #858998;
        }

        @media (max-width: 900px) {
            header {
                padding: 0 5%;
            }

            nav {
                gap: 15px;
            }

            nav a:not(.nav-read) {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 70px 7%;
            }

            .hero-visual {
                margin-top: 20px;
            }

            .story-grid,
            .about-grid,
            .feedback-grid {
                grid-template-columns: 1fr;
                gap: 45px;
            }
